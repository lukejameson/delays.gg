# todo.yaml — single source of truth for LLM
# Updated: 2026-06-15T09:30:00Z

goal: >
  Harden the airways.gg data pipeline by fixing 11 identified issues: duplicate
  scraper instances, FR24 failures, inconsistent statuses, duplicate flights,
  missing route data, display bugs, and tooling defects.

why_how: >
  The pipeline ingests data from airport.gg (HTML/JSON) and FlightRadar24
  (browser scraper). Issues range from duplicate Docker instances producing
  duplicate log entries, to 29 inconsistent diversion status strings, to a
  broken weather API tool. The plan follows the research brief's recommended
  ordering: infrastructure fixes first, then scraper reliability, then data
  normalization, then dedup, route gaps, and finally display/tooling bugs.
  User decisions: normalize diversion statuses in-place (no schema change),
  add 24-hour TTL for aircraft_positions, extract shared scheduler logic
  from the two scrapers into @airways/common.

expected: >
  All 11 issues resolved. No duplicate scraper instances. FR24 scraper
  recovers from Cloudflare challenges without manual intervention. All
  diversion statuses normalized to "Diverted". BA1344 duplicate removed
  and prevented. BRS/EXT/LCY flights populated with status and aircraft.
  Delay display shows "-7m" not "+-7m". airways_weather tool works.
  Tomorrow's flights don't leak into today's unfiltered API. Shared
  scheduler logic in @airways/common. Positions cleaned up after 24h.

status: in_progress

